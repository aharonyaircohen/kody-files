name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local app
        run: |
          pnpm start > /tmp/kody-files-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3335/ > /dev/null; then
              exit 0
            fi
            echo "Waiting for local app ($attempt/30)"
            sleep 1
          done
          cat /tmp/kody-files-next.log
          exit 1
      - run: pnpm exec playwright test tests/e2e/files.spec.ts
